[package]
name = "acquia-certbot-deploy-hooks"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
json = "0.12.4"
oauth2 = { version = "5.0.0", features = ["reqwest-blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
#opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
